<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Milind's Calculator</title>
  <link rel="stylesheet" href="calculatorstyle.css">
  <script src="calculatorscript.js"defer></script>

</head>
<body>
  <div class="Calculator">
        <h2>A Basic Calculator</h2>
        <div id="InputFirstNum">
            <p>Please enter your first number:</p>
            <input id="num1" type ="number" placeholder="Enter First Number">
        </div>

        <div id="InputSecondNum">
            <p>Please enter your second number:</p>
            <input id="num2" type ="number" placeholder="Enter Second number">   
        </div>
        <p>Choose a basic arithmetic operation from the following options below:</p>
        <div id="Buttons">
            <button onclick="Addition()">Add</button>
            <button onclick="Subtraction()">Subtract</button>
            <button onclick="Multiply()">Multiply</button>
            <button onclick="Division()">Divide</button>
        </div>
       <output id="result">The result is: <span id="answer"></span></output>
        







  </div>
  
</body>
</html>
